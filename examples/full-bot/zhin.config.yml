configVersion: 2
log_level: info

http:
  token: ${HTTP_TOKEN:-full-bot-dev-token}
  port: 8069

database:
  dialect: sqlite
  filename: ./data/full-bot.db

# MCP / A2A 的 Bearer：各自的协议令牌，或带全局 mcp.access / a2a.access 的 Console API 令牌。
# http.token 只是初始化令牌，创建首个所有者后失效，不要拿它当协议凭据。
mcp:
  enabled: true
  path: /mcp
  token: ${MCP_TOKEN:-full-bot-mcp-dev-token}
  allowUnauthenticatedLocalhost: false

a2a:
  enabled: true
  path: /a2a
  token: ${A2A_TOKEN:-full-bot-a2a-dev-token}

ai:
  enabled: true
  # --- 可选多模态（需 optional peer，见 docs/ai/index.md）---
  # multimodal:
  #   audio:
  #     strategy: transcribe   # 需 @zhin.js/speech
  memory:
    semantic:
      enabled: true
      autoConsolidate: false
  agent:
    execSecurity: allowlist
    execPreset: readonly
  trigger:
    prefixes:
      - "ai:"
    respondToAt: true
    respondToPrivate: true

# speech:
#   stt:
#     provider: ollama
#     model: whisper
#   tts:
#     provider: edge
# htmlRenderer:
#   width: 540
#   viewport:
#     height: 600
#   scale: 1

# Root 与 child Plugin 配置严格按 manifest topology 分层。
plugin: {}

plugins:
  sandbox: "@zhin.js/adapter-sandbox"
  napcat: "@zhin.js/adapter-napcat"
  kook: "@zhin.js/adapter-kook"
sandbox:
  endpoints:
    - id: full-bot-sandbox
      owner: local-user
napcat:
  connection: ws
  endpoints:
    - id: full-bot-napcat
      url: ${ONEBOT11_WS_URL}
      access_token: ${ONEBOT11_ACCESS_TOKEN}
kook:
  connection: websocket
  endpoints:
    - id: full-bot-kook
      token: ${KOOK_TOKEN}
