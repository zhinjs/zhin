database:
  dialect: sqlite
  filename: ./data/bot.db
  mode: wal

endpoints:
  - context: icqq
    name: ${ICQQ_ACCOUNT}
    master: 1659488338
  - context: github
    name: zhin-ai
    app_id: ${GITHUB_APP_ID}
    private_key: ${GITHUB_PRIVATE_KEY}
    webhook_secret: ${GITHUB_WEBHOOK_SECRET}
    webhook_path: /pub/github/webhook

plugins:
  - example
  - "@zhin.js/http"
  - "@zhin.js/console"
  - "@zhin.js/adapter-sandbox"
  - "@zhin.js/adapter-icqq"
  - "@zhin.js/adapter-github"

hostApi:
  lazyLoad: true
inbox:
  enabled: true

# AI：plan 是显式导入提案；运行时模型以 Console 确认后的数据库配置为准
# 编排使用 discover / load_tool 按需加载能力，并通过 spawn_task 委派复杂任务
ai:
  agents:
    zhin:
      mcpServers:
        - icqq
  sessions:
    maxHistory: 200
    expireMs: 604800000
    useDatabase: true
  context:
    enabled: true
    maxRecentMessages: 100
    summaryThreshold: 50
    keepAfterSummary: 10
    maxContextTokens: 4000
  mcpServers:
    # icqq 守护进程 MCP（地址/令牌：icqq service status / icqq config get mcp）
    - name: icqq
      transport: streamable-http
      url: ${ICQQ_MCP_URL}
      headers:
        Authorization: "Bearer ${ICQQ_MCP_TOKEN}"
  agent:
    execSecurity: allowlist
    execPreset: custom
    execApprovalMode: ask
    subagentExecApprovalMode: auto
    workerExecApprovalMode: auto
    execAllowlist:
      - echo
      - sort
      - uniq
      - jq
      - icqq
      - du
      - df
      - uname
      - which
  trigger:
    prefixes:
      - "AI:"
    respondToAt: true
    respondToPrivate: true
    timeout: 60000
  plan:
    version: 1
    services:
      openai-main:
        driver: openai
        options:
          baseUrl: ${AI_API_BASE}
        models:
          mimo-v2.5-pro:
            id: mimo-v2.5-pro
            kinds:
              - language
            protocol: openai-chat
            input:
              - text
            streaming: true
            toolCalling: true
    accounts:
      openai-main:
        service: openai-main
        auth:
          method: api-key
          source: env://AI_API_KEY
    profiles:
      openai-main:mimo-v2.5-pro:
        account: openai-main
        model: mimo-v2.5-pro
    purposes:
      chat:
        profile: openai-main:mimo-v2.5-pro

60s:
  apiBase: https://services.zhin.dev

http:
  token: ${HTTP_TOKEN}
  base: /api
