configVersion: 2
log_level: info

http:
  token: ${HTTP_TOKEN:-multi-agent-room-dev-token}
  port: 8070

database:
  dialect: sqlite
  filename: ./data/room.db

ai:
  enabled: true
  # ADR 0048: one shared IM room, one Bot Endpoint per member Agent.
  venues:
    - id: product-room
      conversation:
        platform: sandbox
        sceneType: group
        sceneId: product-room
      visibility: visible
      entry: planner
      members:
        - agent: planner
          botEndpoint: planner-bot
        - agent: builder
          botEndpoint: builder-bot
        - agent: reviewer
          botEndpoint: reviewer-bot
  agent:
    execSecurity: allowlist
    execPreset: readonly
    execApprovalMode: ask
  trigger:
    respondToAt: true
    respondToPrivate: true

plugin: {}

plugins:
  sandbox: "@zhin.js/adapter-sandbox"
sandbox:
  endpoints:
    - id: planner-bot
      owner: local-user
    - id: builder-bot
      owner: local-user
    - id: reviewer-bot
      owner: local-user
