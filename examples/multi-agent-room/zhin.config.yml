log_level: 1

plugin: {}

# 用户只面对一个 Endpoint；Agent 间委派不经过 IM。
plugins:
  sandbox:
    endpoints:
      - context: sandbox
        id: assistant-bot
        owner: planner-user

http:
  token: ${HTTP_TOKEN:-multi-agent-room-dev-token}
  port: 8788

database:
  dialect: sqlite
  filename: .zhin/data.sqlite

ai:
  enabled: true
  sessions:
    useDatabase: true
  providers:
    ollama:
      sdk: ollama
      host: ${OLLAMA_HOST:-http://127.0.0.1:11434}
  agents:
    zhin:
      provider: ollama
      model: qwen3:8b
    planner:
      provider: ollama
      model: qwen3:8b
    researcher:
      provider: ollama
      model: qwen3:8b
  agent:
    execSecurity: allowlist
    execPreset: readonly
  trigger:
    prefixes:
      - "ai:"
    respondToAt: true
    respondToPrivate: true
