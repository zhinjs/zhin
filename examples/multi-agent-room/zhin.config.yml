log_level: info

database:
  dialect: sqlite
  filename: ./data/room.db

plugins:
  - adapter-sandbox

sandbox:
  enabled: true
  path: /sandbox
  endpoints:
    - context: sandbox
      name: planner-bot
      capabilities: [inbound, outbound]
    - context: sandbox
      name: builder-bot
      capabilities: [inbound, outbound]
    - context: sandbox
      name: reviewer-bot
      capabilities: [inbound, outbound]

ai:
  enabled: true
  defaultProvider: deepseek
  providers:
    deepseek:
      apiKey: ${DEEPSEEK_API_KEY}
      models:
        - deepseek-chat
  venues:
    - id: product-room
      adapter: sandbox
      scene: group:product-room
      mode: visible
      entry: planner
      participants:
        planner: sandbox:planner-bot
        builder: sandbox:builder-bot
        reviewer: sandbox:reviewer-bot
  routing:
    respondOnDirect: true
    respondOnMention: true
  security:
    execSecurity: allowlist
    execApprovalMode: ask
