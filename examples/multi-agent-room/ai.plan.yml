version: 1
services:
  deepseek:
    driver: openai-compatible
    options:
      baseUrl: https://api.deepseek.com/v1
    models:
      deepseek-chat:
        id: deepseek-chat
        kinds:
          - language
        protocol: openai-chat
        input:
          - text
        streaming: true
        toolCalling: true
accounts:
  deepseek:
    service: deepseek
    auth:
      method: api-key
      source: env://DEEPSEEK_API_KEY
profiles:
  deepseek:deepseek-chat:
    account: deepseek
    model: deepseek-chat
purposes:
  chat:
    profile: deepseek:deepseek-chat
  agents:
    planner:
      profile: deepseek:deepseek-chat
    builder:
      profile: deepseek:deepseek-chat
    reviewer:
      profile: deepseek:deepseek-chat
