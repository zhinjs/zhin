# process-monitor 插件配置示例（zhin.config.yml，configVersion: 2）
configVersion: 2

# 实例别名 → 插件包名
plugins:
  process-monitor: "@zhin.js/process-monitor"

# 与实例别名同名的顶层块就是该插件的业务配置
process-monitor:
  enabled: true
  notifyOnStart: true
  notifyOnRestart: true
  notifyOnCrash: true

  # 通知渠道：当前只支持 webhook（POST application/json）
  notifyChannels:
    - type: webhook
      target: "${PROCESS_MONITOR_WEBHOOK_URL}" # 从环境变量读取

# 环境变量配置（.env 文件）
# PROCESS_MONITOR_WEBHOOK_URL=https://your-monitoring-system.example/webhook
