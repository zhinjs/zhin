name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_unpublished_check:
        description: 'Skip unpublished-package gate (emergency only; do not use for normal releases)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  plan:
    if: github.repository == 'zhinjs/zhin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: choose release work before installing or building
        id: mode
        run: node scripts/ci/release-mode.mjs

  validate:
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/full-validation.yml
    secrets:
      PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

  approve-publication:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/plan-validation
        id: proof
        with:
          workflow: publish.yml
          release-proof: 'true'
          npm-token: ${{ secrets.PERSONAL_TOKEN }}
      - name: require successful full validation and exact generated version tree
        env:
          FULL: ${{ steps.proof.outputs.full }}
        run: test "$FULL" = false

  version:
    needs: [plan, validate]
    if: needs.plan.outputs.mode == 'prepare' && needs.validate.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_TOKEN: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - uses: ./.github/actions/restore-pnpm-store
      - name: install version tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
        env:
          NPM_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      - name: require the validated source to still be main
        run: |
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo "main advanced; rerun the release batch before generating versions"; exit 1; }
      # No publish input, npm token, production environment or OIDC permission.
      - name: open or update version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm bump
          commit: "chore: update versions"
          title: "chore: update versions"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [plan, approve-publication]
    if: needs.plan.outputs.mode == 'publish' && needs.approve-publication.result == 'success'
    environment: npm-production
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.0.2

      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - name: install fonts for Chinese component rendering
        uses: ./.github/actions/setup-rendering-fonts

      - name: setup node.js with npm registry
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: restore pnpm store
        uses: ./.github/actions/restore-pnpm-store

      # npm trusted publishing (OIDC) needs npm CLI >= 11.5.1. pnpm 9 hands the
      # actual upload to the npm CLI on PATH, so make sure that one is new enough.
      - name: ensure npm CLI supports trusted publishing
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is older than $required, upgrading"
            npm install -g "npm@^$required"
          fi
          echo "npm $(npm --version)"

      - name: configure github packages auth
        if: env.NPM_TOKEN != ''
        run: echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc

      - name: install dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build packages
        run: pnpm build

      # Every relative import in packed JS must resolve inside its tarball (#799).
      - name: verify packed relative imports resolve
        run: pnpm check:pack-imports

      - name: verify clean generated project before publishing
        run: pnpm check:created-project

      # Full validation already passed on the immutable pre-version source.
      # approve-publication reproduced this entire version tree against it.
      # Keep build/packed-import/installed-consumer gates on the final versions.

      # npm 可信发布无法创建新包名：新包需维护者手动首次发包（见 docs/contributing/publishing.md）。
      - name: detect packages needing first publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_unpublished_check) }}
        run: pnpm check:unpublished

      - name: report npm publish authentication mode
        env:
          TRUSTED_PUBLISHING_ONLY: ${{ vars.NPM_TRUSTED_PUBLISHING_ONLY }}
        run: |
          if [ "$TRUSTED_PUBLISHING_ONLY" = "true" ]; then
            mode="trusted publishing (OIDC) only"
          else
            mode="trusted publishing (OIDC) first, npm token fallback for packages without a trusted publisher"
          fi
          echo "npm publish authentication: $mode" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: bump versions and publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm bump
          commit: "chore: update versions"
          title: "chore: update versions"
          publish: pnpm pub
          # changesets/action pushes every package tag concurrently when this is
          # enabled. Large monorepo releases can make GitHub reject some refs with
          # `fatal error in commit_refs`; the next step batches tags and creates
          # releases sequentially instead.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authentication (see docs/contributing/publishing.md):
          # - npm first tries trusted publishing (OIDC) for each package. That
          #   works for every package with a trusted publisher on npmjs.com and
          #   always attaches provenance.
          # - If a package has no trusted publisher yet (or the OIDC exchange
          #   fails), npm falls back to the npm token below. Set the repository
          #   variable NPM_TRUSTED_PUBLISHING_ONLY=true to drop the token once
          #   every package has a trusted publisher.
          # - The fallback is only ever an npm token. PERSONAL_TOKEN is a GitHub
          #   token for GitHub Packages installs; npmjs.com rejects it (401/404).
          #   changesets/action writes NPM_TOKEN into the npmjs .npmrc, so it is
          #   overridden here too, not just NODE_AUTH_TOKEN.
          NPM_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING_ONLY != 'true' && secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING_ONLY != 'true' && secrets.NPM_TOKEN || '' }}
          # Token-based publishes get provenance too (needs id-token: write).
          NPM_CONFIG_PROVENANCE: 'true'

      - name: push tags and create GitHub releases
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/create-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
