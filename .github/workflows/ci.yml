name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Resolve repository .npmrc placeholders without exposing credentials to build/test code.
  NPM_TOKEN: ''

jobs:
  test:
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24, 26]
    steps:
      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.0.2

      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: checkout official Console contract consumer
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          repository: zhinjs/console
          path: .tmp/console
          persist-credentials: false

      - name: setup node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # changesets `baseBranch: main` compares against a **local** `main` ref; PR checkouts
      # often only have `origin/main`, which makes `pnpm changeset status` fail.
      - name: sync local main ref for changesets
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      # Dedicated read-only package credential for cross-organization @icqqjs dependencies.
      # Only this script-free install receives it; never fall back to PERSONAL_TOKEN.
      - name: install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: run dependency lifecycle scripts without registry credentials
        run: pnpm rebuild

      - name: audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: pnpm audit --prod || true

      - name: check changeset
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24 && github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'chore/deps-')
        run: pnpm changeset status

      # Large Windows builds can fail to initialize a child process with
      # STATUS_DLL_INIT_FAILED when Turbo fans out multiple nested tsc/tsup processes.
      - name: build packages (Windows)
        if: runner.os == 'Windows'
        run: |
          # Invoke pnpm through Start-Process so GitHub's pwsh wrapper cannot
          # terminate the script on a native STATUS_DLL_INIT_FAILED exit before
          # the incremental retry starts.
          $pnpm = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          $firstBuild = Start-Process -FilePath $pnpm -ArgumentList @('build', '--concurrency=1') -NoNewWindow -Wait -PassThru
          if ($firstBuild.ExitCode -eq 0) { exit 0 }

          # The second pass reuses every completed Turbo task. Transient process
          # initialization failures recover, while real compiler errors stay red.
          Write-Warning "Windows build exited with $($firstBuild.ExitCode); retrying incremental build once."
          $retryBuild = Start-Process -FilePath $pnpm -ArgumentList @('build', '--concurrency=1') -NoNewWindow -Wait -PassThru
          exit $retryBuild.ExitCode

      - name: build packages
        if: runner.os != 'Windows'
        run: pnpm build

      - name: verify packed Console publish contract
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: pnpm check:console-contract
        env:
          ZHIN_CONSOLE_DIR: .tmp/console

      - name: verify clean generated project against candidate packages
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: pnpm check:created-project

      # type-check / lint 在 check:all；unit tests 由下方 coverage 覆盖（HARNESS_SKIP_TEST 避免双跑）
      - name: harness checks (incl. type-check, lint)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: pnpm check:all
        env:
          HARNESS_SKIP_TEST: '1'
          HARNESS_SEQUENTIAL: '1'

      - name: run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: pnpm vitest run --reporter=verbose --coverage

      # The full suite exercises POSIX durability contracts such as directory
      # fsync. Windows remains an install/build compatibility gate; runtime
      # semantics are covered across every supported Node version on Linux.
      - name: run tests (other supported runtimes)
        if: ${{ runner.os != 'Windows' && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 24) }}
        run: pnpm vitest run

      # Public tokenless uploads require Codecov tokenless access to be enabled.
      # Reporting must not reintroduce long-lived secrets into candidate jobs.
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == 24 }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          fail_ci_if_error: false
