name: Nightly model evals

# Real-model trend metrics (#723). Not a PR gate: it never runs on pull requests
# and low pass rates do not fail the job. The PR gate is `pnpm eval:agent` in ci.yml.
on:
  schedule:
    - cron: '30 18 * * *' # 02:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider: gemini (default) or minimax (empty: vars.NIGHTLY_PROVIDER, else gemini)'
        required: false
        default: ''
      models:
        description: 'Comma-separated model ids for that provider (empty: vars.NIGHTLY_MODELS, else the default in evals/nightly/providers.ts)'
        required: false
        default: ''
      runs_per_case:
        description: 'Runs per case per model (empty: vars.NIGHTLY_RUNS_PER_CASE, else 3; budget: see packages/im/agent/evals/README.md)'
        required: false
        default: ''
      mode:
        description: 'nightly (default) or quota-probe: list Gemini models and burn quota until the API reports its RPM/RPD limits (evals/nightly/quota-probe.mjs)'
        required: false
        type: choice
        options: [nightly, quota-probe]
        default: nightly
      probe_max_requests:
        description: 'quota-probe only: max generateContent requests (each is tiny)'
        required: false
        default: '40'
      probe_concurrency:
        description: 'quota-probe only: requests in flight at once (raise to reach the per-minute limit)'
        required: false
        default: '1'

permissions:
  contents: read
  actions: read # download the previous night's report for the diff

# One nightly at a time: CI's Gemini key is on the free tier (per-minute and per-day
# request quotas per project and model), so a dispatched run must queue behind the
# scheduled one instead of sharing the minute. There is no job matrix; inside the run,
# requests are serialized and paced (evals/nightly/rate-limit.ts).
concurrency:
  group: nightly-evals
  cancel-in-progress: false

env:
  CI: true
  NPM_TOKEN: ''
  # gemini (zhin's primary model, #770) unless overridden; minimax stays available.
  NIGHTLY_PROVIDER: ${{ inputs.provider || vars.NIGHTLY_PROVIDER || 'gemini' }}

jobs:
  nightly:
    if: github.repository == 'zhinjs/zhin'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: check secret
        id: secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          case "$NIGHTLY_PROVIDER" in
            gemini) key_name=GEMINI_API_KEY; key="$GEMINI_API_KEY" ;;
            minimax) key_name=MINIMAX_API_KEY; key="$MINIMAX_API_KEY" ;;
            *) echo "::error::Unknown NIGHTLY_PROVIDER '$NIGHTLY_PROVIDER' (expected gemini or minimax)."; exit 1 ;;
          esac
          if [ -z "$key" ]; then
            echo "::notice::$key_name secret is not configured; skipping nightly evals ($NIGHTLY_PROVIDER)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: setup pnpm
        if: steps.secret.outputs.present == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.0.2
      - name: checkout repository
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false
      - name: setup node.js
        if: steps.secret.outputs.present == 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: restore pnpm store
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        uses: ./.github/actions/restore-pnpm-store
      - name: install dependencies
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
        env:
          NPM_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      - name: run dependency lifecycle scripts without registry credentials
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        run: pnpm rebuild
      - name: build
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        run: pnpm build
      - name: download previous report
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest successful run that has a nightly report (quota-probe runs have none).
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly-evals.yml --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name nightly-eval-report --dir previous-report 2>/dev/null; then break; fi
          done
      - name: quota probe
        if: steps.secret.outputs.present == 'true' && inputs.mode == 'quota-probe'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          PROBE_MODEL: ${{ inputs.models }}
          PROBE_MAX_REQUESTS: ${{ inputs.probe_max_requests }}
          PROBE_CONCURRENCY: ${{ inputs.probe_concurrency }}
          PROBE_MAX_MINUTES: '35'
          PROBE_REPORT: ${{ github.workspace }}/eval-reports/quota-probe.json
        run: node packages/im/agent/evals/nightly/quota-probe.mjs
      - name: run nightly evals
        if: steps.secret.outputs.present == 'true' && inputs.mode != 'quota-probe'
        env:
          # Keys are only passed as env; the eval reads the selected provider's (evals/nightly/providers.ts).
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          NIGHTLY_MODELS: ${{ inputs.models || vars.NIGHTLY_MODELS }}
          # CI's Gemini key is on the free tier. The default model, gemini-3.5-flash-lite,
          # gets 15 requests/minute and 500/day (429 quotaValue, quota-probe runs 38699390939
          # and 38700947142); a full night is ~82 requests (run 38699654531). So a gemini night
          # sends 3 trials per case, ≤120 requests (24% of the RPD), 5 s apart (12 RPM).
          # Repository variables override these; empty values fall back to budget.ts /
          # rate-limit.ts (3 trials, 120 requests, 4 s).
          # gemini-3.8-flash (5 RPM / 20 RPD on this key) needs 1 trial, 20 requests, 12 s.
          NIGHTLY_RUNS_PER_CASE: ${{ inputs.runs_per_case || vars.NIGHTLY_RUNS_PER_CASE || '3' }}
          NIGHTLY_MAX_REQUESTS: ${{ vars.NIGHTLY_MAX_REQUESTS }}
          NIGHTLY_MIN_REQUEST_INTERVAL_MS: ${{ vars.NIGHTLY_MIN_REQUEST_INTERVAL_MS || (env.NIGHTLY_PROVIDER == 'gemini' && '5000' || '') }}
          NIGHTLY_REPORT_DIR: ${{ github.workspace }}/eval-reports
          NIGHTLY_PREVIOUS_REPORT: ${{ github.workspace }}/previous-report/nightly.json
        run: pnpm eval:nightly
      - name: job summary
        if: steps.secret.outputs.present == 'true' && always()
        run: |
          if [ -f eval-reports/nightly.md ]; then cat eval-reports/nightly.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload report
        if: steps.secret.outputs.present == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.mode == 'quota-probe' && 'quota-probe-report' || 'nightly-eval-report' }}
          path: eval-reports/
          retention-days: 30
          if-no-files-found: ignore
