<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zhin 适配器界面预览</title>
  <style>
    body { margin: 0; background: #fff; color: #242427; font-family: 'Avenir Next','Segoe UI','PingFang SC',sans-serif; }
    .preview-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #e3e3e7; font-size: 12px; }
    .preview-bar span { color: #686870; margin-right: auto; }
    .preview-bar a, .preview-bar button { color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; font: inherit; padding: 4px; }
    .preview-bar a[aria-current="page"] { font-weight: 700; text-decoration: underline; text-underline-offset: 5px; }
    .dark body { background: #18181b; color: #f4f4f5; }
    .dark .preview-bar { border-color: #3a3a40; }
    .dark .preview-bar span { color: #aaaab2; }
    .preview-sandbox { padding: 16px; }
    @media(max-width: 600px) { .preview-bar { padding: 12px; gap: 8px; } .preview-bar span { width: 100%; } .preview-sandbox { padding: 8px; } }
  </style>
</head>
<body>
  <nav class="preview-bar" aria-label="预览工具">
    <span>界面预览 · 合成数据，不连接真实平台</span>
    <a href="/icqq">ICQQ</a><a href="/telegram">Telegram</a><a href="/discord">Discord</a><a href="/sandbox">会话</a><a href="/bilibili">评论审批</a>
    <button id="theme" type="button" aria-pressed="false">深色模式</button>
  </nav>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
