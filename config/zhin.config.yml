configVersion: 2
log_level: info

# 插件实例配置（Plugin Runtime 形态）：plugins.<instanceKey> 对象。
# 适配器 endpoint 在对应实例配置内声明，例如：
# plugins:
#   icqq:
#     endpoints:
#       - name: '123456789'        # 须先 icqq login；name 为 QQ 号
#         master: '你的用户ID'      # ⚠️ Endpoint Master（ask_user 安全确认目标）
plugins:
  sandbox: "@zhin.js/adapter-sandbox"
  music: "@zhin.js/plugin-music"
  icqq: "@zhin.js/adapter-icqq"
  slack: "@zhin.js/adapter-slack"
  github: "@zhin.js/adapter-github"
  qq: "@zhin.js/adapter-qq"
  game-hub: "@zhin.js/plugin-game-hub"
  guess-number: "@zhin.js/plugin-guess-number"
  dice-duel: "@zhin.js/plugin-dice-duel"
  dungeon-expedition: "@zhin.js/plugin-dungeon-expedition"
  rps: "@zhin.js/plugin-rps"
  tic-tac-toe: "@zhin.js/plugin-tic-tac-toe"
  idiom-chain: "@zhin.js/plugin-idiom-chain"
  word-riddle: "@zhin.js/plugin-word-riddle"
  text-adventure: "@zhin.js/plugin-text-adventure"
  blackjack: "@zhin.js/plugin-blackjack"
  qrcode: "@zhin.js/plugin-qrcode"
  short-url: "@zhin.js/plugin-short-url"
  link-poster: "@zhin.js/plugin-link-poster"
  code-runner: "@zhin.js/plugin-code-runner"
  lottery: "@zhin.js/plugin-lottery"
  group-suite: "@zhin.js/plugin-group-suite"
  activity-feedback: "@zhin.js/service-activity-feedback"
  process-monitor: "@zhin.js/process-monitor"
  content-moderation: "@zhin.js/plugin-content-moderation"

