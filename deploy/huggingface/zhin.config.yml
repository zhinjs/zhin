configVersion: 2

http:
  host: 0.0.0.0
  port: 7860
  token: zhin-demo
  corsOrigins:
    - "https://console.zhin.dev"
    - "https://zhinjs-demo.hf.space"

# Model settings live in the Host database; ai.plan.yml seeds it on first start.
database:
  dialect: sqlite
  filename: ./data/playground.db

# OpenRouter free tier — see ai.plan.yml; API key via Space Secret OPENROUTER_API_KEY
ai:
  enabled: true
  agent:
    execSecurity: deny
    execApprovalMode: auto
    maxIterations: 8
  sessions:
    useDatabase: false
    maxHistory: 30
    expireMs: 3600000
  trigger:
    respondToAt: true
    respondToPrivate: true
    prefixes:
      - "ai:"
      - "AI:"
      - "#"
    ignorePrefixes:
      - "/"
      - "!"
      - "！"
    timeout: 90000

plugin: {}

plugins:
  sandbox: "@zhin.js/adapter-sandbox"
sandbox:
  endpoints:
    - id: demo
      owner: demo-user
